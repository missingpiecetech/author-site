<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crownfall Wiki · The Codex</title>
<meta name="description" content="A spoiler-aware encyclopedia of Crownfall by Michael Vadney: the characters, magic and world of the island city of Burunt.">
<meta name="theme-color" content="#121017">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: michaelvadney.com's ink-and-gold look on a Coppermind skeleton: sticky header, left rail, article column with a framed infobox. Single dark theme by design. */
:root{
  --ink:#121017; --ink-2:#17141d; --panel:#1c1922; --panel-2:#25202c; --line:#3a3342; --line-2:#4a4353;
  --parch:#ece4d4; --parch-2:#c9c0ae; --dim:#b3a996;
  --gold:#cfae6b; --gold-hi:#e6c98c; --gold-wash:#cfae6b1f; --gold-line:#cfae6b66;
  --warn:#d98b6a;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:Spectral, Georgia, "Times New Roman", serif;
  --header-h:4.25rem;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--header-h) + 16px)}
body{background:var(--ink);color:var(--parch);font-family:var(--body);font-size:16.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold-hi)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--header-h);background:color-mix(in srgb,var(--ink) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--panel-2)}
.top-in{height:100%;max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap;color:var(--parch)}
.brand b{font-family:var(--display);font-weight:600;font-size:1.6rem;letter-spacing:.02em}
.brand small{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.search{position:relative;flex:1;max-width:440px;margin-left:auto}
.search input{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:2px;color:var(--parch);font:inherit;font-size:.95rem;padding:8px 12px 8px 36px}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:var(--gold-line);outline:none}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--dim)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);max-height:60vh;overflow:auto;box-shadow:0 18px 40px #0009}
.results a{display:block;padding:9px 14px;border-bottom:1px solid var(--panel-2);color:var(--parch)}
.results a:hover,.results a.on{background:var(--panel-2)}
.results a span{display:block;font-size:.8rem;color:var(--dim);line-height:1.4}
.results .none{padding:10px 14px;color:var(--dim);font-size:.9rem}
.menu-btn{display:none;background:transparent;border:1px solid var(--line-2);border-radius:2px;padding:7px 10px;line-height:0}
.menu-btn svg{width:18px;height:18px;stroke:var(--parch)}

/* Shell */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 80px}
.rail{position:sticky;top:calc(var(--header-h) + env(safe-area-inset-top,0px) + 24px);align-self:start;max-height:calc(100vh - var(--header-h) - 48px);overflow:auto;display:flex;flex-direction:column;gap:26px;padding-right:4px}
.rail h4,.eyebrow{font-family:var(--body);font-weight:500;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.rail nav a{display:block;padding:4px 0 4px 12px;border-left:1px solid var(--line);color:var(--parch-2);font-size:.95rem}
.rail nav a:hover{color:var(--parch);border-left-color:var(--gold-line)}
.rail nav a.cur{color:var(--parch);border-left-color:var(--gold)}
.progress{background:var(--ink-2);border:1px solid var(--panel-2);padding:14px}
.progress p{margin:0 0 10px;font-size:.84rem;line-height:1.5;color:var(--parch-2)}
.progress select{width:100%;background:var(--panel);color:var(--parch);border:1px solid var(--line-2);border-radius:2px;font:inherit;font-size:.9rem;padding:6px 8px}
.progress .row{display:flex;gap:8px;margin-top:10px}
.btn{background:transparent;border:1px solid var(--line-2);border-radius:2px;padding:6px 10px;font-size:.82rem;color:var(--parch);flex:1}
.btn:hover{border-color:var(--gold-line)}
.btn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:500}
.btn.gold:hover{background:var(--gold-hi)}

/* Article */
main{min-width:0}
.crumbs{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.crumbs a{color:var(--gold)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(2.3rem,4.6vw,3.2rem);line-height:1.08;margin:0 0 4px;text-wrap:balance}
.blurb{font-family:var(--display);font-style:italic;font-size:1.28rem;color:var(--parch-2);margin:0 0 18px;line-height:1.4}
.rule{border:0;height:1px;background:linear-gradient(90deg,var(--gold-line),var(--line) 40%,transparent);margin:0 0 22px}
.notice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--gold-line);background:var(--gold-wash);padding:11px 14px;margin:0 0 22px;font-size:.9rem;line-height:1.5;color:var(--parch-2)}
.notice svg{flex:none;width:18px;height:18px;margin-top:2px;stroke:var(--gold)}
.notice strong{color:var(--parch)}
.notice .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.notice .btn{flex:none}
.prose{max-width:46rem}
.prose p{margin:0 0 1em}
.prose h2{font-family:var(--display);font-weight:600;font-size:1.85rem;line-height:1.2;margin:1.6em 0 .5em;padding-bottom:6px;border-bottom:1px solid var(--line);text-wrap:balance}
.prose ul{padding-left:1.2em;margin:0 0 1em}
.prose li{margin:.25em 0}
.prose li::marker{color:var(--gold)}
.prose blockquote{margin:1em 0;padding-left:16px;border-left:2px solid var(--gold-line);font-style:italic;color:var(--parch-2)}
.prose a[data-to]{border-bottom:1px solid var(--gold-line)}
.prose .dead{color:var(--parch)}
cite{font-style:normal;font-size:.62em;vertical-align:super;line-height:0;margin-left:1px}
cite a{color:var(--gold);letter-spacing:.02em;white-space:nowrap;border:0!important}
.epigraph{margin:0 0 24px;max-width:40rem;font-family:var(--display);font-style:italic;font-size:1.3rem;line-height:1.45;color:var(--parch)}
.epigraph footer{font-family:var(--body);font-style:normal;font-size:.8rem;color:var(--dim);margin-top:4px}
.epigraph footer::before{content:"";display:inline-block;width:22px;height:1px;background:var(--gold);vertical-align:middle;margin-right:8px}
.art{display:flow-root}

/* Infobox: double gold hairline frame, a nod to the cover's gilded border */
.infobox{float:right;width:300px;margin:4px 0 22px 30px;background:var(--ink-2);border:1px solid var(--gold-line);outline:1px solid var(--panel-2);outline-offset:3px}
.infobox .ib-title{font-family:var(--display);font-weight:600;font-size:1.35rem;text-align:center;padding:12px 14px 10px;border-bottom:1px solid var(--gold-line);background:linear-gradient(180deg,var(--panel),var(--ink-2))}
.infobox .ib-sub{display:block;font-family:var(--body);font-weight:400;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-top:2px}
.infobox dl{margin:0;padding:6px 0}
.infobox .r{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:7px 14px;border-bottom:1px solid var(--panel-2);font-size:.86rem;line-height:1.5}
.infobox .r:last-child{border-bottom:0}
.infobox dt{color:var(--dim);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding-top:3px}
.infobox dd{margin:0;min-width:0;overflow-wrap:anywhere}
.toc{display:inline-block;min-width:240px;max-width:100%;background:var(--ink-2);border:1px solid var(--panel-2);padding:12px 18px 12px 16px;margin:4px 0 18px}
.toc ol{margin:0;padding-left:1.3em;font-size:.92rem;line-height:1.6}
.toc li::marker{color:var(--dim);font-size:.85em}
.toc a{color:var(--parch-2)}
.toc a:hover{color:var(--gold-hi)}

/* Spoilers */
.sp{--c:var(--warn)}
span.sp.shut{display:inline-flex;align-items:center;gap:6px;vertical-align:baseline;cursor:pointer;background:repeating-linear-gradient(135deg,var(--panel-2) 0 6px,var(--panel) 6px 12px);border:1px dashed var(--gold-line);border-radius:2px;padding:0 8px;font-size:.78rem;line-height:1.6;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);user-select:none}
span.sp.shut:hover{border-color:var(--gold);color:var(--gold-hi)}
span.sp.shut > .sp-c{display:none}
span.sp:not(.shut){background:var(--gold-wash);box-shadow:inset 0 -1px var(--gold-line);border-radius:1px;padding:0 2px}
.sp-label{display:none}
.sp-demo{display:inline-flex;align-items:center;gap:6px;background:repeating-linear-gradient(135deg,var(--panel-2) 0 6px,var(--panel) 6px 12px);border:1px dashed var(--gold-line);border-radius:2px;padding:0 8px;font-size:.78rem;line-height:1.6;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.sp-demo svg{width:12px;height:12px;stroke:currentColor}
.shut > .sp-label{display:inline-flex;align-items:center;gap:6px}
.sp-label svg{width:12px;height:12px;stroke:currentColor}
div.sp{position:relative;margin:0 0 1em}
div.sp.shut{cursor:pointer;border:1px dashed var(--gold-line);background:repeating-linear-gradient(135deg,var(--ink-2) 0 8px,var(--panel) 8px 16px);padding:14px 16px;color:var(--gold)}
div.sp.shut:hover{border-color:var(--gold)}
div.sp.shut > .sp-c{display:none}
div.sp.shut > .sp-label{display:flex;gap:10px;font-size:.86rem;letter-spacing:.06em}
div.sp.shut > .sp-label em{font-style:normal;color:var(--parch-2);letter-spacing:0;text-transform:none}
div.sp:not(.shut){border-left:2px solid var(--gold);padding:2px 0 2px 16px}
div.sp:not(.shut)::before{content:attr(data-tag);display:block;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.sp-hide{position:absolute;top:0;right:0;background:none;border:0;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:2px 0}
.sp-hide:hover{color:var(--gold)}
div.sp.shut > .sp-hide{display:none}
.infobox span.sp.shut{font-size:.7rem}

/* Home */
.hero{position:relative;padding:34px 0 30px;margin-bottom:30px;border-bottom:1px solid var(--line);overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-140px;width:520px;height:520px;background:radial-gradient(closest-side,#cfae6b26,transparent);pointer-events:none}
.hero h1{font-size:clamp(2.6rem,6vw,4.2rem)}
.hero .tag{font-family:var(--display);font-style:italic;font-size:1.35rem;color:var(--parch-2);margin:2px 0 16px}
.hero p.intro{max-width:44rem;color:var(--parch-2);margin:0}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:22px}
.stats div{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.stats b{display:block;font-family:var(--display);font-weight:600;font-size:2rem;letter-spacing:0;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}
.portals{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin:0 0 36px}
.portal{display:flex;flex-direction:column;gap:6px;background:var(--ink-2);border:1px solid var(--panel-2);padding:18px 18px 16px;color:var(--parch);transition:border-color .2s}
.portal:hover{border-color:var(--gold-line);color:var(--parch)}
.portal h3{font-family:var(--display);font-weight:600;font-size:1.6rem;margin:0;line-height:1.1}
.portal p{margin:0;font-size:.9rem;color:var(--parch-2);line-height:1.5}
.portal .ct{margin-top:auto;padding-top:8px;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.home-cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px}
.home-cols h2{font-family:var(--display);font-weight:600;font-size:1.7rem;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.feature p{margin:0 0 .9em}
.dyk{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.dyk li{font-size:.93rem;line-height:1.55;padding-left:16px;position:relative;color:var(--parch-2)}
.dyk li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;transform:rotate(45deg);border:1px solid var(--gold)}

/* Category index */
.group{margin:0 0 34px}
.group h2{font-family:var(--display);font-weight:600;font-size:1.7rem;margin:0 0 14px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:block;background:var(--ink-2);border:1px solid var(--panel-2);padding:13px 15px;color:var(--parch)}
.card:hover{border-color:var(--gold-line);color:var(--parch)}
.card b{display:block;font-family:var(--display);font-weight:600;font-size:1.22rem;line-height:1.2}
.card span{display:block;font-size:.85rem;line-height:1.5;color:var(--dim);margin-top:4px}

/* Spoiler shield: hidden articles, gated glossary terms, chapter badges */
.card .tag{display:inline-block;margin-top:8px;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.card.locked{cursor:pointer;text-align:left;width:100%;font:inherit;color:var(--gold);background:repeating-linear-gradient(135deg,var(--ink-2) 0 8px,var(--panel) 8px 16px);border:1px dashed var(--gold-line)}
.card.locked:hover{border-color:var(--gold)}
.card.locked b{display:flex;align-items:center;gap:8px;font-family:var(--body);font-weight:500;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.card.locked b svg{width:13px;height:13px;stroke:currentColor}
.card.locked span{color:var(--parch-2)}
.group.shielded h2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.group.shielded h2 .btn{flex:none;font-family:var(--body);font-size:.78rem}
.group .hint{font-size:.88rem;color:var(--dim);margin:-6px 0 14px}
.chbadge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold-line);border-radius:2px;padding:1px 8px;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);white-space:nowrap;vertical-align:middle}
.prose li.gl-shut{cursor:pointer;list-style:none;margin-left:-1.2em}
.prose li.gl-shut > *:not(.gl-label){display:none}
.prose li.gl-shut{font-size:0}
.gl-label{display:none}
.prose li.gl-shut > .gl-label{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px dashed var(--gold-line);background:repeating-linear-gradient(135deg,var(--panel-2) 0 6px,var(--panel) 6px 12px);padding:1px 8px;border-radius:2px}
.prose li.gl-shut:hover > .gl-label{border-color:var(--gold)}
.gl-label svg{width:12px;height:12px;stroke:currentColor}
.gate{max-width:40rem;border:1px dashed var(--gold-line);background:repeating-linear-gradient(135deg,var(--ink-2) 0 10px,var(--panel) 10px 20px);padding:28px 26px}
.gate h1{font-size:2.2rem}
.gate p{color:var(--parch-2);margin:0 0 14px}
.gate .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.gate .btn{flex:none;padding:8px 14px;font-size:.9rem}

.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--panel-2);font-size:.85rem;color:var(--dim)}

@media (max-width:980px){
  .home-cols{grid-template-columns:1fr}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;gap:0;padding-block:20px 60px}
  .rail{position:fixed;z-index:55;top:calc(var(--header-h) + env(safe-area-inset-top,0px));left:0;bottom:0;width:min(300px,86vw);max-height:none;background:var(--ink);border-right:1px solid var(--line);padding:20px max(16px,env(safe-area-inset-left,0px)) 40px;transform:translateX(-102%);transition:transform .25s}
  .rail.open{transform:none;box-shadow:20px 0 40px #0009}
  .menu-btn{display:inline-flex}
  .brand small{display:none}
  .infobox{float:none;width:100%;margin:0 0 22px}
}
@media (max-width:520px){
  .brand b{font-size:1.3rem}
  .top-in{gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <button class="menu-btn" id="menuBtn" aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="brand" href="#"><b>Crownfall</b><small>The Wiki</small></a>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search characters, places, magic" autocomplete="off" aria-label="Search the wiki">
      <div class="results" id="results" hidden></div>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="rail" id="rail">
    <div>
      <h4>Navigation</h4>
      <nav id="nav">
        <a href="#" data-r="">Main page</a>
        <a href="#characters" data-r="characters">Characters</a>
        <a href="#magic" data-r="magic">Magic</a>
        <a href="#world" data-r="world">World</a>
        <a href="#story" data-r="story">The Story</a>
        <a href="#chapter-guide" data-r="chapter-guide">Chapter guide</a>
        <a href="#glossary" data-r="glossary">Glossary</a>
        <a href="#" id="randomLink">Random article</a>
      </nav>
    </div>
    <div class="progress">
      <h4>Spoiler shield</h4>
      <p>Spoilers stay hidden until you click them. Tell the wiki how far you've read and it will open everything up to that chapter.</p>
      <label for="readTo" class="eyebrow" style="display:block">I've read through</label>
      <select id="readTo"></select>
    </div>
  </aside>

  <main id="main" tabindex="-1"></main>
</div>

<script>
const DATA = __DATA__;
const CATS = {
  characters:{name:"Characters", key:"Characters", desc:"The thieves, engineers, nobles and tyrants of Burunt.", order:["Point-of-view characters","Major characters","Supporting characters"]},
  magic:{name:"Magic", key:"Magic", desc:"Draumer forging, the tether, and the rune-craft of imperial signarium.", order:["Draumer powers","Draumer artifacts","Signarium"]},
  world:{name:"World", key:"World", desc:"The island of Burunt, the empire that holds it, and the people who resist.", order:["Places","Nations and peoples","Organizations and factions","Culture and history"]},
  story:{name:"The Story", key:"Story", desc:"The novel, its chapters, and the order of events.", order:[]}
};
const byId = Object.fromEntries(DATA.map(a=>[a.id,a]));
const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const WARN = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>';
let readTo = 0;
try{ readTo = parseInt(localStorage.getItem("cf-readto")||"0",10)||0 }catch(e){}

/* ---------- reading-progress select ---------- */
const sel = document.getElementById("readTo");
sel.innerHTML = '<option value="0">Nothing yet (hide all)</option>' +
  Array.from({length:55},(_,i)=>`<option value="${i+1}">Chapter ${i+1}</option>`).join("") +
  '<option value="56">Finished the book</option>';
sel.value = String(readTo);
function setReadTo(n){
  readTo = n; sel.value = String(n);
  try{ localStorage.setItem("cf-readto",String(readTo)) }catch(e){}
  route(true);
}
sel.addEventListener("change",()=>setReadTo(parseInt(sel.value,10)));

/* ---------- spoiler shield ---------- */
// Chapters 1-3 are the free setup, so their articles are always listed.
const FREE = 3;
const unlocked = new Set();            // articles the reader chose to open early (this visit only)
const shieldAt = () => Math.max(readTo, FREE);
const isHidden = a => (a.firstCh||0) > shieldAt() && !unlocked.has(a.id);
const subOf = a => (a.subSafe && shieldAt() < a.subSafe.ch && !unlocked.has(a.id)) ? a.subSafe.alt : (a.sub||"Other");
const maxCh = a => { const m = JSON.stringify(a).match(/data-ch=\\"(\d+)\\"/g)||[]; return m.reduce((x,s)=>Math.max(x,parseInt(s.replace(/\D/g,""),10)),0) };

/* ---------- rendering helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function enhance(root){
  // links
  root.querySelectorAll("a[data-to]").forEach(a=>{
    const id=a.getAttribute("data-to");
    if(byId[id]){ a.href="#"+id; }
    else { const s=document.createElement("span"); s.className="dead"; s.innerHTML=a.innerHTML; a.replaceWith(s); }
  });
  // citations
  root.querySelectorAll("cite").forEach(c=>{
    if(c.dataset.done) return; c.dataset.done=1;
    const parts=c.textContent.split(/[,;&]|\band\b/).map(s=>s.replace(/[^0-9\-–]/g,"")).filter(Boolean);
    c.innerHTML="["+parts.map(n=>{const first=parseInt(n,10);return `<a href="#chapter-guide" data-goch="${first}" title="Chapter ${esc(n)}">Ch ${esc(n)}</a>`}).join(", ")+"]";
  });
  // spoilers
  root.querySelectorAll(".sp").forEach(sp=>{
    if(sp.dataset.done) return; sp.dataset.done=1;
    const ch=parseInt(sp.dataset.ch||"55",10)||55;
    const isBlock = sp.tagName==="DIV";
    const inner=document.createElement(isBlock?"div":"span"); inner.className="sp-c";
    while(sp.firstChild) inner.appendChild(sp.firstChild);
    const label=document.createElement(isBlock?"div":"span"); label.className="sp-label";
    label.innerHTML = isBlock
      ? `${EYE}<span>Spoiler · Chapter ${ch}</span><em>Click to reveal</em>`
      : `${EYE}Spoiler · Ch ${ch}`;
    sp.append(label,inner);
    sp.setAttribute("data-tag",`Spoiler · Chapter ${ch}`);
    sp.setAttribute("role","button"); sp.tabIndex=0;
    sp.setAttribute("aria-label",`Spoiler from chapter ${ch}. Activate to reveal.`);
    if(isBlock){
      const h=document.createElement("button"); h.className="sp-hide"; h.type="button"; h.textContent="Hide";
      h.addEventListener("click",e=>{e.stopPropagation();shut(sp)});
      sp.appendChild(h);
    }
    const open=e=>{ if(sp.classList.contains("shut")){ e.preventDefault(); e.stopPropagation(); reveal(sp);} };
    sp.addEventListener("click",open);
    sp.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&sp.classList.contains("shut")) open(e) });
  });
  // glossary terms from later chapters: hide the term name itself
  root.querySelectorAll("li[data-ch]").forEach(li=>{
    if(li.dataset.done) return; li.dataset.done=1;
    const ch=parseInt(li.dataset.ch,10);
    const label=document.createElement("span"); label.className="gl-label";
    label.innerHTML=`${EYE}Glossary term · Ch ${ch}`;
    li.prepend(label);
    li.addEventListener("click",e=>{ if(li.classList.contains("gl-shut")){ e.preventDefault(); e.stopPropagation(); openTerm(li); } });
    li.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&li.classList.contains("gl-shut")){ e.preventDefault(); openTerm(li);} });
  });
  applyShield(root);
}
function openTerm(li){
  li.classList.remove("gl-shut"); li.removeAttribute("tabindex"); li.removeAttribute("role");
  const ch=parseInt(li.dataset.ch,10);
  li.querySelectorAll(".sp").forEach(sp=>{ if((parseInt(sp.dataset.ch,10)||55)<=ch) reveal(sp); });
}
function shutTerm(li){ li.classList.add("gl-shut"); li.tabIndex=0; li.setAttribute("role","button"); li.setAttribute("aria-label",`Glossary term from chapter ${li.dataset.ch}. Activate to reveal.`); }
function reveal(sp){sp.classList.remove("shut");sp.removeAttribute("role");sp.removeAttribute("tabindex");sp.removeAttribute("aria-label")}
function shut(sp){sp.classList.add("shut");sp.setAttribute("role","button");sp.tabIndex=0}
function applyShield(root){
  root.querySelectorAll(".sp").forEach(sp=>{
    const ch=parseInt(sp.dataset.ch||"55",10)||55;
    if(ch<=readTo) reveal(sp); else shut(sp);
  });
  root.querySelectorAll("li[data-ch]").forEach(li=>{
    if(parseInt(li.dataset.ch,10)<=readTo) openTerm(li); else shutTerm(li);
  });
}
function setAll(open){
  document.querySelectorAll("#main .sp").forEach(sp=>open?reveal(sp):shut(sp));
  document.querySelectorAll("#main li[data-ch]").forEach(li=>open?openTerm(li):shutTerm(li));
}

function countSpoilers(a){
  const s=JSON.stringify(a); return (s.match(/class=\\"sp/g)||[]).length;
}

/* ---------- views ---------- */
function viewHome(){
  const n=DATA.length, chars=DATA.filter(a=>a.cat==="Characters").length;
  const gl=byId["glossary"]; const glN = gl? (JSON.stringify(gl).match(/<li/g)||[]).length : 0;
  const portal=(k)=>{const c=CATS[k];const cnt=DATA.filter(a=>a.cat===c.key).length;return `<a class="portal" href="#${k}"><h3>${c.name}</h3><p>${c.desc}</p><span class="ct">${cnt} articles</span></a>`};
  const feat=byId["kyndel-heim"]||DATA[0];
  const book=byId["crownfall"];
  return `
  <section class="hero">
    <div class="eyebrow">A standalone dark epic fantasy · Michael Vadney</div>
    <h1>Welcome to the Crownfall Wiki</h1>
    <div class="tag">Trust is the hardest lesson.</div>
    <p class="intro">An encyclopedia of the island of Burunt and everyone fighting over it: the Draumer thief who wants the Viceroy dead, the imperial engineer who won't build weapons, and the noble heir holding a ruined House together with contracts and nerve.</p>
    <div class="stats"><div><b>${n}</b>Articles</div><div><b>${chars}</b>Characters</div><div><b>55</b>Chapters</div>${glN?`<div><b>${glN}</b>Glossary terms</div>`:""}</div>
  </section>
  <div class="notice">${WARN}<div><strong>Spoiler policy.</strong> Anything beyond the opening setup is hidden behind a striped <span class="sp-demo">${EYE}Spoiler · Ch 12</span> marker naming the chapter where it is revealed. Click a marker to open it, or set <em>I've read through</em> in the sidebar to reveal everything up to your place in the book.</div></div>
  <div class="portals">${["characters","magic","world","story"].map(portal).join("")}</div>
  <div class="home-cols">
    <section class="feature">
      <h2>Featured article</h2>
      <div class="prose">
        <p class="eyebrow" style="margin-bottom:2px">${esc(feat.sub||feat.cat)}</p>
        <h3 style="font-family:var(--display);font-size:1.7rem;font-weight:600;margin:0 0 8px"><a href="#${feat.id}" style="color:var(--parch)">${esc(feat.title)}</a></h3>
        ${feat.lead||""}
        <p><a href="#${feat.id}">Read the full article →</a></p>
      </div>
    </section>
    <section>
      <h2>Did you know…</h2>
      <ul class="dyk">${DYK.map(d=>`<li>${d}</li>`).join("")}</ul>
      ${book?`<h2 style="margin-top:28px">About the book</h2><div class="prose" style="font-size:.95rem">${book.lead||""}<p><a href="#crownfall">The Crownfall article →</a></p></div>`:""}
    </section>
  </div>`;
}
function viewCat(k){
  const c=CATS[k]; const all=DATA.filter(a=>a.cat===c.key);
  const items=all.filter(a=>!isHidden(a)), hidden=all.filter(isHidden).sort((x,y)=>x.firstCh-y.firstCh);
  const subs=[...new Set([...c.order,...items.map(subOf)])].filter(s=>items.some(a=>subOf(a)===s));
  const badge=a=>{const m=maxCh(a);return m>shieldAt()?`<span class="tag">Spoilers to Ch ${m}</span>`:""};
  const shielded = hidden.length?`<section class="group shielded"><h2>Hidden by your spoiler shield <button class="btn" type="button" data-unlock="${hidden.map(a=>a.id).join(",")}">Show all anyway</button></h2>
    <p class="hint">${hidden.length} article${hidden.length>1?"s":""} cover${hidden.length>1?"":"s"} things first named after the chapter you've reached. Titles stay hidden until you get there, or click one to open it now.</p>
    <div class="cards">${hidden.map(a=>`<button class="card locked" type="button" data-unlock="${a.id}"><b>${EYE}Hidden article</b><span>First named in Chapter ${a.firstCh}</span></button>`).join("")}</div></section>`:"";
  return `<div class="crumbs"><a href="#">Main page</a></div>
  <h1>${c.name}</h1><p class="blurb">${c.desc}</p><hr class="rule">
  ${subs.map(s=>`<section class="group"><h2>${esc(s)}</h2><div class="cards">${items.filter(a=>subOf(a)===s).map(a=>`<a class="card" href="#${a.id}"><b>${esc(a.title)}</b><span>${esc(a.blurb||"")}</span>${badge(a)}</a>`).join("")}</div></section>`).join("")}
  ${shielded}`;
}
function viewGate(a){
  return `<div class="crumbs"><a href="#">Main page</a></div>
  <div class="gate">
    <div class="eyebrow">Spoiler shield</div>
    <h1>Hidden article</h1>
    <p>This article is about something first named in <strong>Chapter ${a.firstCh}</strong>. ${readTo?`You've told the wiki you've read through Chapter ${Math.min(readTo,55)}.`:"You haven't told the wiki how far you've read yet."} Even its title could give part of the story away.</p>
    <div class="acts">
      <button class="btn gold" type="button" data-unlock="${a.id}" data-open="1">Show this article anyway</button>
      <button class="btn" type="button" data-setread="${a.firstCh}">I've read through Chapter ${a.firstCh}</button>
      <a class="btn" href="javascript:history.back()" style="text-align:center">Go back</a>
    </div>
  </div>`;
}
function viewArticle(a){
  const catKey=Object.keys(CATS).find(k=>CATS[k].key===a.cat)||"story";
  const nsp=countSpoilers(a);
  const top=maxCh(a);
  const sub=subOf(a);
  const ib=a.infobox&&a.infobox.rows&&a.infobox.rows.length?`<aside class="infobox"><div class="ib-title">${esc(a.title)}<span class="ib-sub">${esc(sub||a.cat)}</span></div><dl>${a.infobox.rows.map(r=>`<div class="r"><dt>${esc(r[0])}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></aside>`:"";
  const secs=(a.sections||[]);
  const toc=secs.length>=3?`<nav class="toc" aria-label="Contents"><div class="eyebrow">Contents</div><ol>${secs.map((s,i)=>`<li><a href="#${a.id}" data-sec="s${i}">${esc(s.h)}</a></li>`).join("")}</ol></nav>`:"";
  const q=a.quote&&a.quote.text?`<blockquote class="epigraph">“${esc(a.quote.text)}”<footer>${esc(a.quote.who||"")}${a.quote.ch?`, Chapter ${esc(a.quote.ch)}`:""}</footer></blockquote>`:"";
  const safeNow = top<=readTo;
  return `<div class="crumbs"><a href="#">Main page</a> / <a href="#${catKey}">${CATS[catKey].name}</a>${sub?" / "+esc(sub):""}</div>
  <h1>${esc(a.title)}</h1>${a.blurb?`<p class="blurb">${esc(a.blurb)}</p>`:""}<hr class="rule">
  ${top?`<div class="notice">${WARN}<div><strong>Spoilers through Chapter ${top}.</strong> <span class="chbadge">${safeNow?"Safe for you":`You're at ${readTo?"Ch "+Math.min(readTo,55):"the start"}`}</span><br>${safeNow?`You've read past everything this article reveals, so it's shown in full.`:`${nsp} passage${nsp>1?"s are":" is"} hidden, each marked with the chapter that reveals it. Click one to open it.`}<div class="acts"><button class="btn gold" type="button" data-all="1">Reveal all on this page</button><button class="btn" type="button" data-all="0">Hide all</button></div></div></div>`:""}
  <div class="art">${ib}${q}<div class="prose">${a.lead||""}${toc}${secs.map((s,i)=>`<h2 id="s${i}">${esc(s.h)}</h2>${s.html}`).join("")}</div></div>
  <div class="foot">Part of the <a href="#${catKey}">${CATS[catKey].name}</a> section · Source: <em>Crownfall</em> by Michael Vadney</div>`;
}

/* ---------- router ---------- */
const main=document.getElementById("main");
function route(keepScroll){
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  const y=window.scrollY;
  let html;
  if(!h) html=viewHome();
  else if(CATS[h]) html=viewCat(h);
  else if(byId[h]) html=isHidden(byId[h])?viewGate(byId[h]):viewArticle(byId[h]);
  else html=`<h1>Page not found</h1><p class="blurb">There is no article called “${esc(h)}”.</p><p><a href="#">Back to the main page</a></p>`;
  main.innerHTML=html;
  enhance(main);
  document.querySelectorAll("#nav a[data-r]").forEach(a=>{
    const r=a.dataset.r; const art=byId[h];
    const cur = r===h || (art && r && CATS[r] && CATS[r].key===art.cat && !["chapter-guide","glossary"].includes(h));
    a.classList.toggle("cur",!!cur);
  });
  document.title = byId[h]? (isHidden(byId[h])?"Hidden article":byId[h].title)+" · Crownfall Wiki" : CATS[h]? CATS[h].name+" · Crownfall Wiki" : "Crownfall Wiki";
  window.scrollTo(0,keepScroll===true?y:0);
  document.getElementById("rail").classList.remove("open");
  if(pendingCh){ const n=pendingCh; pendingCh=null; requestAnimationFrame(()=>{ const t=[...main.querySelectorAll("h2")].find(x=>new RegExp("^Chapter "+n+"\\b").test(x.textContent)); if(t) t.scrollIntoView(); }); }
}
let pendingCh=null;
main.addEventListener("click",e=>{
  const all=e.target.closest("[data-all]"); if(all){ setAll(all.dataset.all==="1"); return; }
  const un=e.target.closest("[data-unlock]");
  if(un){ e.preventDefault(); const ids=un.dataset.unlock.split(","); ids.forEach(i=>unlocked.add(i));
    if(un.dataset.open||ids.length===1&&!CATS[location.hash.slice(1)]) route(); else route(true); return; }
  const sr=e.target.closest("[data-setread]"); if(sr){ e.preventDefault(); setReadTo(parseInt(sr.dataset.setread,10)); return; }
  const sec=e.target.closest("[data-sec]"); if(sec){ e.preventDefault(); document.getElementById(sec.dataset.sec)?.scrollIntoView(); return; }
  const go=e.target.closest("[data-goch]");
  if(go){ e.preventDefault(); const n=go.dataset.goch;
    if(location.hash==="#chapter-guide"){ const t=[...main.querySelectorAll("h2")].find(x=>new RegExp("^Chapter "+n+"\\b").test(x.textContent)); if(t) t.scrollIntoView(); }
    else { pendingCh=n; location.hash="chapter-guide"; } }
});
window.addEventListener("hashchange",route);

/* ---------- search ---------- */
const q=document.getElementById("q"), res=document.getElementById("results");
const strip=s=>String(s||"").replace(/<span class="sp"[\s\S]*?<\/span>|<div class="sp"[\s\S]*?<\/div>/g," ").replace(/<[^>]+>/g," ");
const INDEX=DATA.map(a=>({a,t:a.title.toLowerCase(),b:(a.blurb||"").toLowerCase(),x:strip(a.lead).toLowerCase()}));
let hi=0;
function search(){
  const v=q.value.trim().toLowerCase(); if(!v){res.hidden=true;return}
  const scored=INDEX.map(o=>({o,s:o.t.startsWith(v)?4:o.t.includes(v)?3:o.b.includes(v)?2:o.x.includes(v)?1:0})).filter(r=>r.s);
  const hits=scored.filter(r=>!isHidden(r.o.a)).sort((x,y)=>y.s-x.s||x.o.t.localeCompare(y.o.t)).slice(0,10);
  const nHidden=scored.filter(r=>isHidden(r.o.a)).length;
  hi=0;
  const more=nHidden?`<div class="none">${nHidden} more result${nHidden>1?"s":""} hidden by your spoiler shield.</div>`:"";
  res.innerHTML=hits.length?hits.map((h,i)=>`<a href="#${h.o.a.id}" class="${i===0?"on":""}">${esc(h.o.a.title)}<span>${esc(h.o.a.cat)} · ${esc(h.o.a.blurb||"")}</span></a>`).join("")+more:(more||`<div class="none">No articles match “${esc(q.value)}”.</div>`);
  res.hidden=false;
}
q.addEventListener("input",search);
q.addEventListener("keydown",e=>{
  const links=[...res.querySelectorAll("a")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ if(!links.length)return; e.preventDefault(); hi=(hi+(e.key==="ArrowDown"?1:-1)+links.length)%links.length; links.forEach((l,i)=>l.classList.toggle("on",i===hi)); }
  else if(e.key==="Enter"&&links[hi]){ location.hash=links[hi].getAttribute("href").slice(1); q.value=""; res.hidden=true; q.blur(); }
  else if(e.key==="Escape"){ res.hidden=true; }
});
res.addEventListener("click",()=>{q.value="";res.hidden=true});
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) res.hidden=true; });

/* ---------- misc ---------- */
document.getElementById("menuBtn").addEventListener("click",()=>document.getElementById("rail").classList.toggle("open"));
document.getElementById("randomLink").addEventListener("click",e=>{e.preventDefault();const pool=DATA.filter(a=>a.id!==location.hash.slice(1)&&!isHidden(a));location.hash=pool[Math.floor(Math.random()*pool.length)].id;});
const DYK = __DYK__;
route();
</script>
