<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>The Noble Dark Circle: email header options</title>
		<style>
			body {
				margin: 0;
				padding: 48px 24px 64px;
				background: #121017;
				color: #ece4d4;
				font-family: Georgia, 'Times New Roman', serif;
			}
			h1 {
				margin: 0 0 8px;
				font-weight: 600;
				font-size: 32px;
				text-align: center;
			}
			.intro {
				margin: 0 auto 40px;
				max-width: 640px;
				color: #c9c0ae;
				text-align: center;
				line-height: 1.5;
			}
			.alt {
				color: #cfae6b;
			}
			.grid {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 48px 40px;
			}
			figure {
				margin: 0;
				width: 600px;
				max-width: 100%;
			}
			figure img {
				display: block;
				width: 600px;
				max-width: 100%;
				height: auto;
				outline: 1px solid #2c2733;
			}
			figcaption {
				margin-top: 12px;
				color: #c9c0ae;
				font-size: 15px;
			}
			figcaption strong {
				color: #cfae6b;
				font-weight: 600;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				font-size: 13px;
				margin-right: 8px;
			}
		</style>
	</head>
	<body>
		<h1>The Noble Dark Circle: email header options</h1>
		<p class="intro">
			Four headers for the newsletter. Each PNG is 1200px wide and is shown here at its 600px display width. Suggested
			alt text:
			<span class="alt">"The Noble Dark Circle, a newsletter from Michael Vadney"</span>
		</p>
		<div class="grid">
			<figure>
				<img
					src="noble-dark-circle-header-1-framed.png"
					width="600"
					height="260"
					alt="The Noble Dark Circle, a newsletter from Michael Vadney" />
				<figcaption><strong>1. Framed title</strong> 600 × 260 display (1200 × 520 PNG)</figcaption>
			</figure>
			<figure>
				<img
					src="noble-dark-circle-header-2-over-art.png"
					width="600"
					height="260"
					alt="The Noble Dark Circle, a newsletter from Michael Vadney" />
				<figcaption><strong>2. Over art</strong> 600 × 260 display (1200 × 520 PNG)</figcaption>
			</figure>
			<figure>
				<img
					src="noble-dark-circle-header-3-crest.png"
					width="600"
					height="270"
					alt="The Noble Dark Circle, a newsletter from Michael Vadney" />
				<figcaption><strong>3. Crest</strong> 600 × 270 display (1200 × 540 PNG)</figcaption>
			</figure>
			<figure>
				<img
					src="noble-dark-circle-header-4-minimal.png"
					width="600"
					height="240"
					alt="The Noble Dark Circle, a newsletter from Michael Vadney" />
				<figcaption><strong>4. Minimal</strong> 600 × 240 display (1200 × 480 PNG)</figcaption>
			</figure>
		</div>
	</body>
</html>
